name: Build application and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      ### 🔧 Setup Node.js and install dependencies ###
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18" # or your preferred version (16, 20, etc.)
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      ### 🔍 Adding SNYK for code quality check ###
      - name: Install Snyk
        uses: snyk/actions/setup@master

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Upload results to Snyk Dashboard
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --strict-out-of-sync=false --file=package.json

      - name: Snyk Test (Code)
        run: snyk test --strict-out-of-sync=false --file=package.json --severity-threshold=medium

      # - name: Snyk Test (Docker Image)
      #   run: |
      #     docker build -t my-react-app .
      #     snyk test --docker my-react-app --file=Dockerfile --severity-threshold=high

      ## Continue with docker container push
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        # run: docker build -t nathmankind/capstone-react-app .
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t nathmankind/capstone-react-app .

      - name: Publish to Docker hub
        run: docker push nathmankind/capstone-react-app:latest

  deploy:
    needs: build
    runs-on: ec2-lts-01
    steps:
      - name: -- Pull image from docker hub --
        run: docker pull nathmankind/capstone-react-app:latest

      - name: Delete old container
        run: docker rm -f react-container

      - name: Run docker container
        run: docker run -d -p 3000:80 --name react-container nathmankind/capstone-react-app
