server {
    listen 80;

    # Set the root directory for your built React files
    root /usr/share/nginx/html;

    # Main Nginx block
    location / {
        # Check for the requested file ($uri)
        # Check for the requested directory ($uri/)
        # If neither is found, fall back to serving index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Serve error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}